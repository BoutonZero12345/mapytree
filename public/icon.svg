<svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">


  <!-- ARBORESCENCE GAUCHE (Turquoise) -->
  <!-- Translatée à la pointe (100,105), pivotée de -45°, et ajustée par rapport à son ancien point de départ -->
  <g transform="translate(100, 105) rotate(-45) translate(-88, -123)">
    <!-- Lignes -->
    <g stroke="#71C2BA" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M 88 123 C 75 118, 70 95, 60 70"/>
      <path d="M 83 119 C 82 105, 80 90, 85 78"/>
      <path d="M 73 107 C 60 105, 50 100, 40 100"/>
      <path d="M 85 122 C 75 128, 65 128, 55 135"/>
    </g>
    <!-- Anneaux -->
    <g stroke="#71C2BA" stroke-width="5" fill="#FFFFFF">
      <circle cx="60" cy="70" r="4.5"/>
      <circle cx="85" cy="78" r="4.5"/>
      <circle cx="40" cy="100" r="4.5"/>
      <circle cx="55" cy="135" r="4.5"/>
    </g>
  </g>

  <!-- ARBORESCENCE DROITE (Jaune Moutarde) -->
  <!-- Translatée à la pointe (100,105), pivotée de 45°, et ajustée par rapport à son ancien point de départ -->
  <g transform="translate(100, 105) rotate(45) translate(-112, -123)">
    <!-- Lignes -->
    <g stroke="#F3CE6E" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M 112 123 C 125 118, 130 95, 140 70"/>
      <path d="M 117 119 C 118 105, 120 90, 115 78"/>
      <path d="M 127 107 C 140 105, 150 100, 160 100"/>
      <path d="M 115 122 C 125 128, 135 128, 145 135"/>
    </g>
    <!-- Anneaux -->
    <g stroke="#F3CE6E" stroke-width="5" fill="#FFFFFF">
      <circle cx="140" cy="70" r="4.5"/>
      <circle cx="115" cy="78" r="4.5"/>
      <circle cx="160" cy="100" r="4.5"/>
      <circle cx="145" cy="135" r="4.5"/>
    </g>
  </g>

  <!-- LE MARQUEUR CENTRAL (Goutte parfaite) - Placé à la fin pour être au premier plan -->
  <path d="M 100 105 C 100 105, 75 75, 75 50 A 25 25 0 1 1 125 50 C 125 75, 100 105, 100 105 Z" fill="#F0655F"/>
  <circle cx="100" cy="50" r="9" fill="#C84C45"/>

</svg>
